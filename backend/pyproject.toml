[project]
name = "insuretutor"
version = "0.1.0"
description = "Bilingual RAG tutor for insurance plan documents"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # FastAPI dependencies are declared as argument defaults
    "E501",  # line length is handled by the formatter; long literals (regexes, templates) stay readable
]
