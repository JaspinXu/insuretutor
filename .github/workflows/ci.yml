name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · lint, tests, eval gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      EMBEDDING_BACKEND: none
      LLM_PROVIDER: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit + API tests
        run: pytest
      - name: Retrieval regression gate
        run: python -m eval.run retrieval --min-mrr 0.80 --min-hit 0.95
      - name: Guardrail regression gate
        run: python -m eval.run guardrails --min-guardrails 1.0

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker · build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build
      - name: Start and wait for healthy
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q insuretutor)")
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          curl -fsS http://localhost:8000/api/health
      - name: Smoke-test a chat turn (offline mode)
        run: |
          curl -fsSN -X POST http://localhost:8000/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"What happens if I lose my job?"}' | tee /tmp/sse.txt
          grep -q '"cited": \[1' /tmp/sse.txt
      - if: always()
        run: docker compose logs && docker compose down
