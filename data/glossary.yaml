# Lay-language -> brochure-terminology query expansion.
#
# Users ask "what if I lose my job?"; the brochure says "Unemployment
# Protection ... made redundant". When an alias appears in a question, the
# canonical terms are searched as an extra query (in both languages). Matching
# is case-insensitive and script-insensitive (Simplified/Traditional).
# Keep entries grounded in wording that actually appears in the documents.
entries:
  - terms: Unemployment Protection 失業保障 redundant 裁員 特惠寬限期
    aliases: [lose my job, lost my job, laid off, layoff, fired, jobless, unemployed, unemployment, 失業, 失业, 裁員, 裁员, 被解僱, 被解雇, 沒工作, 没工作, 丟了工作, 丢了工作]
