# Lay-language -> brochure-terminology query expansion.
#
# Users ask "what if I lose my job?"; the brochure says "Unemployment
# Protection ... made redundant". When an alias appears in a question, the
# canonical terms are added to the keyword query at reduced weight.
#
# Rules for entries (learned from the retrieval eval, see README):
#   * aliases are words the brochure does NOT use — expanding a query that
#     already uses brochure vocabulary only adds noise;
#   * terms are wording that actually appears in the documents.
# Matching is case-insensitive and script-insensitive (Simplified/Traditional).
entries:
  - terms: Unemployment Protection 失業保障 redundant 裁員 特惠寬限期
    aliases: [lose my job, lost my job, losing my job, laid off, layoff, fired, jobless, unemployed, 被解僱, 被解雇, 沒工作, 没工作, 丟了工作, 丢了工作, 失去工作, 冇工開]
  - terms: Death Benefit 身故保障
    aliases: [die, dies, died, pass away, passed away, 去世, 過世, 过世, 死亡, 死咗]
  - terms: Cooling-off Period Right of Cancellation 冷靜期 取消保單
    aliases: [change my mind, changed my mind, regret, free look, money back, cancel the policy, cancel my policy, 猶豫期, 犹豫期, 後悔, 后悔, 反悔]
  - terms: Surrender Early Surrender 退保 提早退保
    aliases: [cash out, quit the policy, terminate early, end the policy, 解約, 解约, 提早終止, 提早终止]
  - terms: Cash Value Withdrawal automatic periodic withdrawal option 提取現金價值 定期提款權益
    aliases: [take money out, take out money, get money out, access my money, 取錢, 取钱, 提現, 提现, 攞錢]
  - terms: Skip Premium Payments 暫停繳付保費
    aliases: [stop paying, can't pay, cannot pay, can't afford, cannot afford, premium holiday, 暫停繳費, 暂停缴费, 停止繳費, 停止缴费, 不交保費, 不交保费, 停繳, 停缴, 交唔起]
  - terms: Terminal Illness Benefit 末期病症保障
    aliases: [terminally ill, 絕症, 绝症]
  - terms: Guaranteed Insurability Option 保證可保權益
    aliases: [get married, getting married, new baby, have a baby, having a baby, birth of my child, adopt, adoption, without medical, no medical, 結婚, 结婚, 生孩子, 生小孩, 生BB, 領養, 领养, 免體檢, 免体检]
  - terms: Policy Enhancement Option 保單增值權益
    aliases: [automatic increase, increase automatically, 自動增加, 自动增加]
  - terms: Minimum Sum Insured Maximum Sum Insured 最低保障額 最高保障額
    aliases: [minimum coverage, maximum coverage, sum assured, smallest policy, 最低保額, 最低保额, 最高保額, 最高保额, 最少保額]
  - terms: Issue Age At Last Birthday 投保年齡
    aliases: [how old, age limit, too old, maximum age, max age, oldest age, age to apply, eligible age, eligible, eligibility, qualify, who can apply, 年齡限制, 年龄限制, 幾歲, 几岁, 多大, 最大年齡, 最高年齡, 資格, 资格]
  - terms: Premium Expense Charge Cost of Insurance Administrative Charge 保費行政費用 保險成本 一般行政費用
    aliases: [fee, fees, cost, costs, how much does it cost, 收費, 收费, 扣費, 扣费]
  - terms: crediting interest rate Extra Bonus guaranteed interest 派息率 額外回報 利息保證
    aliases: [return, returns, yield, how much will i earn, 收益, 賺多少, 赚多少]
  - terms: Key Exclusions 主要不保事項
    aliases: [not covered, won't pay, will not pay, doesn't pay, does not pay, 不賠, 不赔, 除外, 唔賠]
  - terms: Duty of Disclosure 提供資料責任
    aliases: [medical history, health history, tell the insurer, 如實告知, 如实告知, 隱瞞, 隐瞒, 病史]
  - terms: Policy Currency 保單貨幣單位 Payment Mode 繳費方式
    aliases: [usd, hkd, us dollars, hong kong dollars, pay monthly, payment frequency, 美金, 港幣, 港币, 月供, 月繳, 月缴]
